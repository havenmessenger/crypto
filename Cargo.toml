#
# Haven crypto-core - the FRB-free, pure-Rust crypto/protocol library. A standalone answer to
# "what is the cryptography?" with NOTHING app-specific.
#
# HARD INVARIANT: no `flutter_rust_bridge` dependency, ever. The one-way-dependency guard
# (scripts/check_one_way_dep.py) and the manifest-purity guard (scripts/check_manifest_purity.py)
# both fail CI if this is violated.

[package]
name = "crypto-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
description = "Haven's cryptographic core - OpenPGP (RFC 4880) and MLS-related primitives (RFC 9420), native + WASM, FRB-free."
repository = "https://github.com/havenmessenger/crypto"
readme = "README.md"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["rlib"]

[features]
default = []
# The MIMI lane's rooms keep their participant list in the GroupContext's app data dictionary and change it with
# AppDataUpdate proposals (draft-ietf-mls-extensions, draft-ietf-mimi-room-policy). Off by default: only a consumer of
# the MIMI lane turns it on, so a build without it carries none of openmls's extensions draft.
mimi-app-data = [
    "openmls/extensions-draft",
    "openmls_rust_crypto/extensions-draft",
    "openmls_traits/extensions-draft",
]

[dependencies]
anyhow = "1.0.100"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4.3"
openmls = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83", features = ["js"] }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "ba267737b9511e538a77a41f4480fbed28ff4e83" }
serde = "1.0.228"
serde_json = "1.0.149"
postcard = { version = "1", default-features = false, features = ["alloc"] }
tls_codec = { version = "0.5", features = ["derive", "mls"] }
chrono = { version = "0.4", features = ["clock"] }
pgp = { version = "0.14", default-features = false, features = ["wasm"] }
rand = { version = "0.8" }
rand_chacha = { version = "0.3" }
ed25519-dalek = { version = "2" }
pbkdf2 = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
hkdf = "0.12"
zeroize = { version = "1", features = ["derive"] }
# `stream` is the AEAD crate's STREAM construction, which `sealed_parts` seals and opens with.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "stream"] }
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
bip39 = "2.2.2"
base64 = "0.22"
thiserror = "2"
spake2 = "0.4.0"
subtle = "2"
# HPKE called directly (src/hpke_provider.rs): PSK mode for targeted messages (RFC 9180 section 5.1.2), which
# openmls's crypto trait does not expose, and DeriveKeyPair for the reader seal. Pinned exactly, at the release
# openmls_rust_crypto resolves to, so a build links one HPKE stack.
hpke-rs = { version = "=0.8.0", default-features = false, features = ["hazmat", "serialization"] }
hpke-rs-crypto = "=0.8.0"
hpke-rs-rust-crypto = "=0.8.0"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
missing_errors_doc = "allow"
too_long_first_doc_paragraph = "allow"
