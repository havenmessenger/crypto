# CI for Haven Crypto (crypto-core). Enforces formatting, lints, tests, dependency audit, and
# the standalone-source-of-truth guards below (guard 1: every dependency resolves from
# crates.io; guard 3: no leaf-library reach-up into app-binding types).
#
# This job running on a fresh `actions/checkout`, with nothing else present, IS guard #2
# (standalone-build-in-clean-room): if it's green here, crypto-core is standalone by definition.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer run these checks against a branch on request, without opening a pull request
  # to trigger them.
  workflow_dispatch:
  # Advisories and yanks arrive without a push from us, and an ignore can go stale the same way: the advisory job runs
  # daily on main as well. Only that job runs on the schedule.
  schedule:
    - cron: "23 6 * * *"

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Pinned to match rust-toolchain.toml's `channel` exactly - `@stable` would install
      # whatever "stable" resolves to at CI run time, silently drifting from the pin this repo
      # claims to build under (and, from a fresh clone, actually failing `cargo fmt --check`
      # once the two diverge). Bump both together on a deliberate toolchain update.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: manifest-purity (guard 1)
        run: python3 scripts/check_manifest_purity.py
      - name: one-way-dep (guard 3)
        run: python3 scripts/check_one_way_dep.py
      - name: tell-scan (guard 4)
        run: python3 scripts/check_tell_scan.py
      - name: public-comment-hygiene (guard 5)
        run: python3 scripts/check_public_comment_hygiene.py
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Deny on the lib surface. Tests use unwrap()/panic() idiomatically; they are compiled
        # and run by `cargo test`, just not deny-linted for those. Matches the Haven crate bar.
        run: cargo clippy --lib -- -D warnings
      - name: test
        # guard #2: this job IS the standalone clean-room build (fresh checkout, nothing else present)
        run: cargo test
      - name: clippy and test with mimi-app-data
        # The feature turns on openmls's extensions draft, which adds enum variants and changes how openmls marks a
        # last-resort KeyPackage, so the crate is linted and tested in that state too.
        run: cargo clippy --lib --features mimi-app-data -- -D warnings && cargo test --features mimi-app-data
      - name: clippy and test with did-webvh
        # The did_webvh credential (with mimi-app-data, which it needs) is linted and tested in its own state.
        run: cargo clippy --lib --features did-webvh -- -D warnings && cargo test --features did-webvh
      - name: clippy and test with virtual-clients
        # Under openmls's virtual-clients draft every send goes through src/mls/single_sender.rs; lint and test that
        # state, alone and with did-webvh.
        run: |
          cargo clippy --lib --features virtual-clients -- -D warnings && cargo test --features virtual-clients
          cargo clippy --lib --features virtual-clients,did-webvh -- -D warnings
      - name: a default build carries no virtual-clients draft, and no library build openmls's test-utils
        # The default build's sends are openmls's own convenience methods, as before the feature existed; test-utils,
        # which brings those methods back under the draft, is for this crate's tests only.
        run: |
          if cargo tree -e normal,features -i openmls | grep -q 'virtual-clients-draft'; then
            echo "a default build turns on openmls's virtual-clients draft" >&2
            exit 1
          fi
          if cargo tree -e normal,features -i openmls --features virtual-clients,did-webvh | grep -q 'test-utils'; then
            echo "a library build turns on openmls's test-utils" >&2
            exit 1
          fi
      - name: a default build carries no did_webvh dependency
        # A consumer that does not turn on did-webvh builds none of mls-didwebvh or its verifier.
        run: |
          if cargo tree -e normal --prefix none | grep -E '^(mls-didwebvh|jmap-did-types|jmap-types) '; then
            echo "a default build pulls in a did_webvh dependency" >&2
            exit 1
          fi

  secrets:
    # The same gitleaks version as the pre-commit hook, with .gitleaks.toml, over the checked-out tree. The release
    # archive is checked against its published SHA-256 before it runs.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks
        run: '"$RUNNER_TEMP/gitleaks" detect --source . --no-git --redact --no-banner --config .gitleaks.toml'

  advisories:
    # Every advisory ignore lives in deny.toml with its reason and a machine-checked `until:` condition. cargo-deny
    # fails an ignore that no longer matches anything or names an unknown advisory, and a yanked crate; the condition
    # check fails when an ignore's reason has stopped being true upstream (online on the schedule and on request).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: cargo-deny advisories
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --locked check -D unknown-advisory -D advisory-not-detected advisories
      - name: ignore conditions
        run: |
          python3 scripts/check_advisory_conditions.py --self-test
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            python3 scripts/check_advisory_conditions.py
          else
            python3 scripts/check_advisory_conditions.py --offline
          fi
      - name: git-pin advisories
        # Neither tool matches advisories against a crate pinned to a git revision.
        run: |
          git clone --depth 1 https://github.com/rustsec/advisory-db "$RUNNER_TEMP/advisory-db"
          python3 scripts/check_git_pin_advisories.py --selftest
          python3 scripts/check_git_pin_advisories.py --db "$RUNNER_TEMP/advisory-db"

  reproducible-build:
    if: github.event_name != 'schedule'
    # Stage 1 of docs/REPRODUCIBLE_BUILDS.md: proves the WASM-target build of this crate is
    # byte-identical across two independent builds in a clean checkout. This crate is a plain
    # rlib (no wasm-bindgen post-processing here - that only applies further downstream, to a
    # final cdylib entry point this repo does not build), so the .rlib itself is the artifact
    # to diff. Uses nightly-2026-03-28: the toolchain this crate's WASM
    # build is actively verified against - see rust-toolchain.toml's comment for the full
    # explanation. Verified locally byte-identical before this job was added.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: install pinned nightly + wasm32 target
        run: |
          rustup toolchain install nightly-2026-03-28 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-03-28
      - name: build 1
        run: |
          rm -rf target/wasm32-unknown-unknown
          cargo +nightly-2026-03-28 build --release --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/libcrypto_core.rlib /tmp/build1.rlib
      - name: build 2 (clean)
        run: |
          rm -rf target/wasm32-unknown-unknown
          cargo +nightly-2026-03-28 build --release --target wasm32-unknown-unknown
      - name: diff
        run: |
          sha256sum /tmp/build1.rlib target/wasm32-unknown-unknown/release/libcrypto_core.rlib
          cmp /tmp/build1.rlib target/wasm32-unknown-unknown/release/libcrypto_core.rlib
