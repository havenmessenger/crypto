# A GitHub Release for each version tag. The tests run first; the Release's notes are the CHANGELOG.md section for that
# version, and a tag without one fails. This crate is a library, so the Release attaches no binaries: the signed tag is
# what a release is checked against (see README, "Verifying a release").
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - name: test
        run: cargo test --locked
      - name: the changelog has a section for this version
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > /dev/null

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: release notes from the changelog
        run: python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > release-notes.md
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          body_path: release-notes.md
