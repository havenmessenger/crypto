title = "crypto Gitleaks Config"

[extend]
useDefault = true

[[allowlists]]
description = "Test vectors whose keys are published or exist only for the vector"
paths = [
    # RFC 9420 crypto-basics test vectors, copied from mlswg/mls-implementations (the file's `source` field names the
    # upstream file). Their keys and secrets are published so every implementation can check against them.
    '''src/mls/targeted/testdata/rfc9420_crypto_basics\.json$''',
    # The known-answer stored message and both members' group state (src/mls/targeted/tests/kat.rs). Its keys exist
    # only for this vector, which only the ignored `regenerate_stored_message` test writes.
    '''src/mls/targeted/testdata/stored_message_v1\.json$''',
]

# Cargo lockfiles stay scanned. The default generic-api-key rule reads the dependency name `libcrux-secrets`, with the
# line after it, as a key; only a generic-api-key finding whose match contains that crate name is skipped. A path
# entry would not do: gitleaks skips an allowlisted path whole, whatever else the entry says.
[[allowlists]]
description = "libcrux-secrets dependency name"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ['''libcrux-secrets''']
